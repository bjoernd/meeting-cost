[tool.poetry]
name = "meeting-cost"
version = "0.1.0"
description = ""
authors = ["Bjoern Doebel <bjoern.doebel@gmail.com>"]
readme = "README.md"
packages = [{include = "meeting_cost.py", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.scripts]
meeting-cost = "meeting_cost:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: tests that fetch real data from levels.fyi (run with -m live)"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "W"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.1,<0.18.0)"
]
