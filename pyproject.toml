[tool.poetry]
name = "meeting-cost"
version = "0.1.0"
description = ""
authors = ["Bjoern Doebel <bjoern.doebel@gmail.com>"]
readme = "README.md"
packages = [{include = "meeting_cost.py", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
selenium = "^4.25.0"
pandas = "^2.2.3"
lxml = "^6.1.3"

[tool.poetry.scripts]
meeting-cost = "meeting_cost:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
